services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage:
